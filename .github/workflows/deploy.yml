name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:    # allow manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ── Build & push Docker image to GHCR ─────────────────────
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # required to push to GHCR

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Pin to production stage — no dev tools in the pushed image
          target: runtime

  # ── Run Alembic migrations before serving traffic ──────────
  migrate:
    name: Run DB migrations
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production   # uses GitHub environment secrets

    steps:
      - uses: actions/checkout@v4

      - name: Run migrations via Docker
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            alembic upgrade head

  # ── Deploy to production ───────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: migrate
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/skillforge

            # Pull the latest image
            docker compose pull api worker beat

            # Zero-downtime rolling restart:
            # 1. Start new containers
            # 2. Health check passes
            # 3. Old containers removed
            docker compose up -d --no-deps --remove-orphans api worker beat

            # Confirm API is healthy
            sleep 10
            docker compose ps api | grep -q "healthy" || \
              (echo "API health check failed" && exit 1)

            # Clean up old images
            docker image prune -f