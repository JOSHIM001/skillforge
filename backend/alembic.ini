[alembic]
script_location = /app/alembic
prepend_sys_path = .

# SQLAlchemy URL is overridden in alembic/env.py via pydantic settings
# so this value is only a fallback for the alembic CLI
sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/skillapp

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S